<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AquaShield Traction Dashboard</title><style>body{font-family:system-ui;margin:0;background:#f4f8fa;color:#102333}.wrap{max-width:1100px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h1{font-size:28px;margin:0}.key{display:flex;gap:8px}.key input{padding:10px;border:1px solid #ccdbe2;border-radius:10px}.key button{border:0;background:#0a9d8b;color:#fff;padding:10px 14px;border-radius:10px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #dce8ee;border-radius:18px;padding:20px}.card b{font-size:34px;display:block}.muted{color:#6a7c88;font-size:13px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf2f4}.recent{font-size:13px;line-height:1.4}@media(max-width:760px){.grid,.cols{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.grid,.cols{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h1>AquaShield traction dashboard</h1><div class="key"><input id="key" placeholder="admin key" value="aquashield-demo"><button onclick="load()">Refresh</button></div></div><div id="error" class="muted"></div><div class="grid"><div class="card"><span class="muted">Total visits</span><b id="total">0</b></div><div class="card"><span class="muted">Unique visitors</span><b id="unique">0</b></div><div class="card"><span class="muted">Today</span><b id="today">0</b></div><div class="card"><span class="muted">Waitlist</span><b id="leads">0</b></div></div><div class="cols"><div class="card"><h3>Top sources</h3><div id="sources"></div></div><div class="card"><h3>Top pages</h3><div id="pages"></div></div></div><div class="card" style="margin-top:14px"><h3>Recent traffic</h3><div id="recent" class="recent"></div></div></div><script>async function load(){const key=document.getElementById('key').value;const r=await fetch('/api/stats?key='+encodeURIComponent(key));if(!r.ok){document.getElementById('error').textContent='Unauthorized. Set ADMIN_KEY when deploying.';return}const d=await r.json();document.getElementById('error').textContent='';['total','unique','today','leads'].forEach(k=>document.getElementById(k).textContent=d[k]);document.getElementById('sources').innerHTML=d.sources.map(x=>`<div class=row><span>${x.source}</span><b>${x.visits}</b></div>`).join('');document.getElementById('pages').innerHTML=d.pages.map(x=>`<div class=row><span>${x.path}</span><b>${x.visits}</b></div>`).join('');document.getElementById('recent').innerHTML=d.recent.map(x=>`<div class=row><span>${new Date(x.created_at).toLocaleString()} · ${x.path} · ${x.source||'direct'}</span><b>${x.campaign||''}</b></div>`).join('')}load();setInterval(load,15000)</script></body></html>
